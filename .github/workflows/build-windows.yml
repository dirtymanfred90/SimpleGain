name: Build Windows VST3

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  windows-vst3:
    runs-on: windows-latest
    steps:
      - name: Checkout Simple Gain
        uses: actions/checkout@v4
      - name: Checkout JUCE 8
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: 8.0.8
          path: JUCE
          submodules: recursive
      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -A x64 -DJUCE_DIR="${{ github.workspace }}/JUCE"
      - name: Build Release
        shell: pwsh
        run: cmake --build build --config Release --target SimpleGain_VST3 --parallel 2
      - name: Upload VST3 plugin
        uses: actions/upload-artifact@v4
        with:
          name: SimpleGain-Windows-VST3
          path: build/SimpleGain_artefacts/Release/VST3/*.vst3
          if-no-files-found: error
